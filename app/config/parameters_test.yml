# Fixed values for the tests, whatever app/config/parameters.yml says: imported by
# config_test.yml after it, so they override it. Only the parameters the tests depend on (the
# snapshots, the cache headers, the emails); the database connection is set in config_test.yml.
parameters:
    secret:               ThisTokenIsNotSoSecretChangeIt

    # the Cache-Control max-age of the public pages and API
    cache_expiration:     600

    # the snapshots were recorded without branding: empty titles and texts
    game_name:            ~
    publisher_name:       ~

    email_sender_address: noreply@ringsdb.test
    email_sender_name:    RingsDB

    dragncards_room:      ringsdb
    noindex:              false
