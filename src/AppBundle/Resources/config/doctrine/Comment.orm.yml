AppBundle\Entity\Comment:
    type: entity
    table: comment
    manyToOne:
        user:
            targetEntity: User
            inversedBy: comments
            joinColumn:
                name: user_id
                referencedColumnName: id
                nullable: false
        decklist:
            targetEntity: Decklist
            inversedBy: comments
            joinColumn:
                name: decklist_id
                referencedColumnName: id
                nullable: false
    fields:
        id:
            type: integer
            id: true
            generator:
                strategy: AUTO
        text:
            type: text
        dateCreation:
            type: datetime
            nullable: false
            column: date_creation
            gedmo:
                timestampable:
                    on: create
        isHidden:
            type: boolean
            column: is_hidden
