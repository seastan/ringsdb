App\Entity\Decklistsideslot:
    type: entity
    table: decklistsideslot
    manyToOne:
        decklist:
            targetEntity: Decklist
            inversedBy: sideslots
            joinColumn:
                name: decklist_id
                referencedColumnName: id
                nullable: false
        card:
            targetEntity: Card
            joinColumn:
                name: card_id
                referencedColumnName: id
                nullable: false
    fields:
        id:
            type: integer
            id: true
            generator:
                strategy: AUTO
        quantity:
            type: smallint
