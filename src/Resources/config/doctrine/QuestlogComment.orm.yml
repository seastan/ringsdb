App\Entity\QuestlogComment:
    type: entity
    repositoryClass: App\Repository\QuestlogCommentRepository
    table: questlog_comment
    manyToOne:
        user:
            targetEntity: User
            inversedBy: questlog_comments
            joinColumn:
                name: user_id
                referencedColumnName: id
                nullable: false
        questlog:
            targetEntity: Questlog
            inversedBy: comments
            joinColumn:
                name: questlog_id
                referencedColumnName: id
                nullable: false
    fields:
        id:
            type: integer
            id: true
            generator:
                strategy: AUTO
        text:
            type: text
        dateCreation:
            type: datetime
            nullable: false
            column: date_creation
            gedmo:
                timestampable:
                    on: create
        isHidden:
            type: boolean
            column: is_hidden

