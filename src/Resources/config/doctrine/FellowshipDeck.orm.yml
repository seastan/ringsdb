App\Entity\FellowshipDeck:
    type: entity
    table: fellowship_deck
    manyToOne:
        fellowship:
            targetEntity: Fellowship
            inversedBy: decks
            joinColumn:
                name: fellowship_id
                referencedColumnName: id
                nullable: false
        deck:
            targetEntity: Deck
            inversedBy: fellowships
            joinColumn:
                name: deck_id
                referencedColumnName: id
                nullable: false
    fields:
        id:
            type: integer
            id: true
            generator:
                strategy: AUTO
        deckNumber:
            type: smallint
            column: deck_number