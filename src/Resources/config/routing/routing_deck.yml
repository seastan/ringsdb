deck_buildform:
    path:  /new
    methods: [GET]
    defaults:
        _controller: App\Controller\BuilderController::newAction

deck_save:
    path: /save
    methods: [POST]
    defaults:
        _controller: App\Controller\BuilderController::saveAction

deck_save_ajax:
    path: /save-ajax
    methods: [POST]
    defaults:
        _controller: App\Controller\BuilderController::saveAjaxAction

deck_edit:
    path: /edit/{deck_id}
    methods: [GET]
    defaults:
        _controller: App\Controller\BuilderController::editAction
    requirements:
        deck_id: \d+

deck_view:
    path: /view/{deck_id}
    methods: [GET]
    defaults:
        _controller: App\Controller\BuilderController::viewAction
        deck_id: 0
    requirements:
        deck_id: \d+

deck_clone:
    path: /clone/{deck_id}
    methods: [GET]
    defaults:
        _controller: App\Controller\BuilderController::cloneAction
    requirements:
        deck_id: \d+

deck_delete:
    path: /delete
    methods: [POST]
    defaults:
        _controller: App\Controller\BuilderController::deleteAction

deck_delete_list:
    path: /delete_list
    methods: [POST]
    defaults:
        _controller: App\Controller\BuilderController::deleteListAction

deck_import:
    path: /import
    methods: [GET]
    defaults:
        _controller: App\Controller\BuilderController::importAction

deck_textimport:
    path: /textimport
    methods: [POST]
    defaults:
        _controller: App\Controller\BuilderController::textimportAction

deck_fileimport:
    path: /fileimport
    methods: [POST]
    defaults:
        _controller: App\Controller\BuilderController::fileimportAction

deck_copy:
    path: /copy/{decklist_id}
    defaults:
        _controller: App\Controller\BuilderController::copyAction
    requirements:
        decklist_id: \d+

deck_publish_form:
    path: /publish/{deck_id}
    methods: [GET]
    defaults:
        _controller: App\Controller\SocialController::publishFormAction

decks_upload_all:
    path: /import/all
    methods: [POST]
    defaults:
        _controller: App\Controller\BuilderController::uploadallAction

deck_export_octgn:
    path: /export/octgn/{deck_id}
    methods: [GET]
    defaults:
        _controller: App\Controller\BuilderController::octgnexportAction
    requirements:
        deck_id: \d+

deck_export_text:
    path: /export/text/{deck_id}
    methods: [GET]
    defaults:
        _controller: App\Controller\BuilderController::textexportAction
    requirements:
        deck_id: \d+

deck_export_octgn_list:
    path: /export/octgn/list
    methods: [GET]
    defaults:
        _controller: App\Controller\BuilderController::octgnexportListAction

deck_export_text_list:
    path: /export/text/list
    methods: [GET]
    defaults:
        _controller: App\Controller\BuilderController::textexportListAction

deck_publish:
    path: /can_publish/{deck_id}
    methods: [GET]
    defaults:
        _controller: App\Controller\SocialController::publishAction
        deck_id: \d+

deck_autosave:
    path: /autosave
    methods: [POST]
    defaults:
        _controller: App\Controller\BuilderController::autosaveAction

decks_diff:
    path: /compare/{deck1_id}/{deck2_id}
    methods: [GET]
    defaults:
        _controller: App\Controller\BuilderController::compareAction
    requirements:
        deck1_id: \d+
        deck2_id: \d+