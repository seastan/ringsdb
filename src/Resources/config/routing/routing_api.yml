# these routes are available to anybody
app_api_public:
    resource: "api/routing_api_public.yml"
    prefix: /public

# these routes are available to logged users
app_api_private:
    resource: "api/routing_api_private.yml"
    prefix: /private

# anonymous, CORS-open deck endpoint for external integrations (DragnCards); gated
# per-deck by the owner's "Share my decks" setting. Legacy /oauth2 path kept for
# compatibility — it uses no OAuth (see Oauth2Controller).
app_api_oauth2:
    resource: "api/routing_api_oauth2.yml"
    prefix: /oauth2

api_intro:
    path: /
    defaults:
        _controller: App\Controller\DefaultController::apiIntroAction
