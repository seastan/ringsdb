
decklist_export_octgn:
    path: /export/octgn/{decklist_id}
    methods: [GET]
    defaults:
        _controller: App\Controller\SocialController::octgnexportAction
    requirements:
        decklist_id: \d+

decklist_export_text:
    path: /export/text/{decklist_id}
    methods: [GET]
    defaults:
        _controller: App\Controller\SocialController::textexportAction
    requirements:
        decklist_id: \d+

decklist_detail:
    path: /view/{decklist_id}/{decklist_name}
    methods: [GET]
    defaults:
        _controller: App\Controller\SocialController::viewAction
        decklist_name: null
    requirements:
        decklist_id: \d+

decklist_create:
    path: /create
    methods: [POST]
    defaults:
        _controller: App\Controller\SocialController::createAction

decklist_edit:
    path: /edit/{decklist_id}
    defaults:
        _controller: App\Controller\SocialController::editFormAction
    requirements:
        decklist_id: \d+

decklist_save:
    path: /save/{decklist_id}
    methods: [POST]
    defaults:
        _controller: App\Controller\SocialController::saveAction
    requirements:
        decklist_id: \d+

decklist_delete:
    path: /delete/{decklist_id}
    methods: [POST]
    defaults:
        _controller: App\Controller\SocialController::deleteAction
    requirements:
        decklist_id: \d+
