
collection_custom_pack_new:
    path: /custom-pack/new
    methods: [GET]
    defaults:
        _controller: App\Controller\CustomPackController::newFormAction

collection_custom_pack_save:
    path: /custom-pack/save
    methods: [POST]
    defaults:
        _controller: App\Controller\CustomPackController::saveAction

collection_custom_pack_edit:
    path: /custom-pack/{id}/edit
    methods: [GET]
    defaults:
        _controller: App\Controller\CustomPackController::editFormAction
    requirements:
        id: \d+

collection_custom_pack_update:
    path: /custom-pack/{id}/update
    methods: [POST]
    defaults:
        _controller: App\Controller\CustomPackController::updateAction
    requirements:
        id: \d+

collection_custom_pack_delete:
    path: /custom-pack/{id}/delete
    methods: [POST]
    defaults:
        _controller: App\Controller\CustomPackController::deleteAction
    requirements:
        id: \d+

collection_custom_pack_toggle:
    path: /custom-pack/{id}/toggle
    methods: [POST]
    defaults:
        _controller: App\Controller\CustomPackController::toggleAction
    requirements:
        id: \d+

collection_custom_pack_publish:
    path: /custom-pack/{id}/publish
    methods: [POST]
    defaults:
        _controller: App\Controller\CustomPackController::publishAction
    requirements:
        id: \d+

collection_custom_pack_copy:
    path: /custom-pack/{id}/copy
    methods: [POST]
    defaults:
        _controller: App\Controller\CustomPackController::copyAction
    requirements:
        id: \d+
    options:
        expose: true

collection_packs:
    path: /packs
    methods: [GET]
    defaults:
        _controller: App\Controller\CollectionController::packsAction

collection_save_packs:
    path: /packs/save
    methods: [POST]
    defaults:
        _controller: App\Controller\CollectionController::savePacksAction

collection_save_art:
    path: /art/save
    methods: [POST]
    defaults:
        _controller: App\Controller\CollectionController::saveArtPreferenceAction
    options:
        expose: true
