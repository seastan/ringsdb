api_private_custom_packs:
    path: /custom-packs
    methods: [GET]
    defaults:
        _controller: App\Controller\CustomPackController::apiListAction
    options:
        expose: true

api_private_my_decks:
    path: /decks
    methods: [GET]
    defaults:
        _controller: App\Controller\ApiPrivateController::listDecksAction

api_private_user_decks:
    path: /decks_by_user/{username}
    methods: [GET]
    defaults:
        _controller: App\Controller\ApiPrivateController::listUserDecksAction

api_private_load_deck:
    path: /deck/load/{id}
    methods: [GET]
    defaults:
        _controller: App\Controller\ApiPrivateController::loadDeckAction
    requirements:
        id: \d+

api_private_user_info:
    path: /user/info
    defaults:
        _controller: App\Controller\UserController::infoAction
