fellowship_new:
    path: /new/{deck1_id}/{deck2_id}/{deck3_id}/{deck4_id}
    methods: [GET]
    defaults:
        _controller: App\Controller\FellowshipController::newAction
        deck1_id: null
        deck2_id: null
        deck3_id: null
        deck4_id: null
    requirements:
        deck1_id: \d+
        deck2_id: \d+
        deck3_id: \d+
        deck4_id: \d+

fellowship_save:
    path: /save
    methods: [POST]
    defaults:
        _controller: App\Controller\FellowshipController::saveAction

fellowship_edit:
    path: /edit/{fellowship_id}
    methods: [GET]
    defaults:
        _controller: App\Controller\FellowshipController::editAction
    requirements:
        fellowship_id: \d+

fellowship_view:
    path: /view/{fellowship_id}/{fellowship_name}
    methods: [GET]
    defaults:
        _controller: App\Controller\FellowshipController::viewAction
        fellowship_name: null
    requirements:
        fellowship_id: \d+

fellowship_publish_form:
    path: /publish/{fellowship_id}
    methods: [GET]
    defaults:
        _controller: App\Controller\FellowshipController::publishFormAction
    requirements:
        fellowship_id: \d+

fellowship_publish:
    path: /publish
    methods: [POST]
    defaults:
        _controller: App\Controller\FellowshipController::publishAction

fellowship_export_text:
    path: /export/text/{fellowship_id}
    methods: [GET]
    defaults:
        _controller: App\Controller\FellowshipController::textexportAction
    requirements:
        fellowship_id: \d+

fellowship_export_octgn:
    path: /export/octgn/{fellowship_id}
    methods: [GET]
    defaults:
        _controller: App\Controller\FellowshipController::octgnexportAction
    requirements:
        fellowship_id: \d+

fellowship_delete:
    path: /delete
    methods: [POST]
    defaults:
        _controller: App\Controller\FellowshipController::deleteAction

fellowship_delete_list:
    path: /delete_list
    methods: [POST]
    defaults:
        _controller: App\Controller\FellowshipController::deleteListAction
