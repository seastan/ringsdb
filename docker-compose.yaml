services:
    mysql:
        image: "mysql:8.0"
        volumes:
            # Used by MySQL 8.4
#          - type: bind
#            source: ./docker/dev/mysql/init.sql
#            target: /docker-entrypoint-initdb.d/init.sql
#            read_only: true
#          - type: bind
#            source: ./docker/dev/mysql/my.cnf
#            target: /etc/mysql/conf.d/my.cnf
#            read_only: true
          - type: volume
            source: mysql_data
            target: /var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: passwd
            MYSQL_DATABASE: ringsdb
            MYSQL_USER: symfony
            MYSQL_PASSWORD: passwd
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "symfony", "-ppasswd"]
            interval: 5s
            timeout: 5s
            retries: 10

    mysql_test:
        image: "mysql:8.0"
        volumes:
            # Used by MySQL 8.4
#          - type: bind
#            source: ./docker/dev/mysql/init.sql
#            target: /docker-entrypoint-initdb.d/init.sql
#            read_only: true
#          - type: bind
#            source: ./docker/dev/mysql/my.cnf
#            target: /etc/mysql/conf.d/my.cnf
#            read_only: true
          - type: volume
            source: mysql_test_data
            target: /var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: passwd
            MYSQL_DATABASE: ringsdb_test
            MYSQL_USER: symfony
            MYSQL_PASSWORD: passwd
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "symfony", "-ppasswd"]
            interval: 5s
            timeout: 5s
            retries: 10

    symfony:
        build:
            context: .
            dockerfile: ./docker/dev/symfony/Dockerfile
        volumes:
            - .:/var/www/html
            - ${CARD_IMAGES_DIR:-../card_images}:/var/card_images
        # the Symfony cache (including the Doctrine second-level cache pool) lives in memory
        # rather than on the slow bind mount; it is emptied when the container restarts
        tmpfs:
            - /var/www/html/var/cache:uid=82,gid=82,mode=0755,size=512m
        ports:
            - 8080:8000
        user: www-data
        depends_on:
            mysql:
                condition: service_healthy
        entrypoint: '/var/www/html/docker/dev/symfony/entrypoint.sh'

#    mailer:
#        image: axllent/mailpit
#        ports:
#            - 127.0.0.1:1025:1025
#            - 127.0.0.1:8025:8025
#        environment:
#            MP_SMTP_AUTH_ACCEPT_ANY: 1
#            MP_SMTP_AUTH_ALLOW_INSECURE: 1

    adminer:
        image: adminer
        ports:
            - 8081:8080

    mailer:
        image: axllent/mailpit
        ports:
            - "1025"
            - "8025"
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
    mysql_data:
        driver: local
    mysql_test_data:
        driver: local