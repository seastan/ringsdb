# Doctrine Configuration
doctrine:
    dbal:
        driver:         pdo_mysql
        server_version: 8.0.46
        # the connection of each environment: .env (.env.test for the tests)
        host:           '%env(DATABASE_HOST)%'
        port:           '%env(int:DATABASE_PORT)%'
        dbname:         '%env(DATABASE_NAME)%'
        user:           '%env(DATABASE_USER)%'
        password:       '%env(DATABASE_PASSWORD)%'
        charset:        UTF8
        schema_filter: '~^(?!stat_cards_cache$)~'

    orm:
        auto_generate_proxy_classes: "%kernel.debug%"
        naming_strategy:             doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping:                true
        mappings:
            # the entities of the application (no longer a bundle): docblock annotations in the
            # entity classes
            App:
                is_bundle: false
                type:      annotation
                dir:       '%kernel.project_dir%/src/Entity'
                prefix:    'App\Entity'
                # the 'App:Card' aliases of the DQL and the forms, until they are replaced with the
                # class names (aliases are removed in ORM 3)
                alias:     App
        dql: # see https://github.com/beberlei/DoctrineExtensions/blob/master/config/mysql.yml
            numeric_functions:
                power: DoctrineExtensions\Query\Mysql\Power
            string_functions:
                replace: DoctrineExtensions\Query\Mysql\Replace
