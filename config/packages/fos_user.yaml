fos_user:
    db_driver: orm # other valid values are 'mongodb', 'couchdb' and 'propel'
    firewall_name: main
    user_class: App\Entity\User
    from_email:
        address:     '%env(EMAIL_SENDER_ADDRESS)%'
        sender_name: '%env(EMAIL_SENDER_NAME)%'
    registration:
        confirmation:
            enabled: true
